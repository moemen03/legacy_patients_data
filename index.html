<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>سجلات المرضى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f8; --surface:#ffffff; --surface-2:#f8fafb; --line:#e3e8ec; --line-2:#eef2f4;
  --text:#14212b; --text-2:#51606c; --text-3:#8795a1;
  --accent:#0f766e; --accent-2:#0d9488; --accent-soft:#e3f3f1; --accent-ink:#ffffff;
  --owe:#c2410c; --owe-soft:#fdeee6; --credit:#15803d; --credit-soft:#e6f4ea;
  --done:#16a34a; --prog:#d97706; --plan:#2563eb; --plan-soft:#e8efff; --prog-soft:#fdf2e1; --done-soft:#e5f5ea;
  --alert:#b91c1c; --alert-soft:#fdeaea; --hl:#fde68a;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.06);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.18);
  --r:14px;
  --font:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1419; --surface:#151d24; --surface-2:#1a242c; --line:#26323c; --line-2:#1f2a33;
    --text:#e6edf2; --text-2:#a9b6c0; --text-3:#72818d;
    --accent:#2dd4bf; --accent-2:#5eead4; --accent-soft:#12322f; --accent-ink:#06201d;
    --owe:#fb923c; --owe-soft:#3a2214; --credit:#4ade80; --credit-soft:#14301f;
    --done:#4ade80; --prog:#fbbf24; --plan:#60a5fa; --plan-soft:#16263f; --prog-soft:#382b10; --done-soft:#143021;
    --alert:#f87171; --alert-soft:#3a1717; --hl:#7c5e10;
    --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#0e1419; --surface:#151d24; --surface-2:#1a242c; --line:#26323c; --line-2:#1f2a33;
  --text:#e6edf2; --text-2:#a9b6c0; --text-3:#72818d;
  --accent:#2dd4bf; --accent-2:#5eead4; --accent-soft:#12322f; --accent-ink:#06201d;
  --owe:#fb923c; --owe-soft:#3a2214; --credit:#4ade80; --credit-soft:#14301f;
  --done:#4ade80; --prog:#fbbf24; --plan:#60a5fa; --plan-soft:#16263f; --prog-soft:#382b10; --done-soft:#143021;
  --alert:#f87171; --alert-soft:#3a1717; --hl:#7c5e10;
  --shadow:0 1px 2px rgba(0,0,0,.4); --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--text-2)} .faint{color:var(--text-3)}
a{color:var(--accent)}

/* ---------- top bar ---------- */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;padding:10px 20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);display:grid;place-items:center;color:var(--accent-ink)}
.brand h1{font-size:16px;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--text-3);font-weight:500;margin-top:-2px}
.top .sp{flex:1}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:36px;min-width:36px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;color:var(--text-2);font-size:13px}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:380px 1fr;height:calc(100vh - 57px)}
.side{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.main{overflow:auto;min-width:0}
.main-inner{max-width:1180px;margin:0 auto;padding:22px 24px 60px}

/* ---------- search ---------- */
.search-wrap{padding:16px 16px 10px}
.search{position:relative}
.search input{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 44px 0 70px;font-size:15px;outline:none;transition:border-color .15s,box-shadow .15s}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft);background:var(--surface)}
.search .ico{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
.search kbd{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-family:inherit;font-size:11px;color:var(--text-3);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--surface)}
.search .clear{position:absolute;left:8px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer;color:var(--text-3);padding:6px;display:none}
.search.has .clear{display:block} .search.has kbd{display:none}
.hint{font-size:12px;color:var(--text-3);margin:8px 2px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:4px 16px 10px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:12.5px;cursor:pointer;color:var(--text-2);display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:600;color:var(--text-3);font-size:11.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.on b{color:inherit;opacity:.8}
.list-head{display:flex;align-items:center;justify-content:space-between;padding:6px 16px 8px;font-size:12px;color:var(--text-3);border-bottom:1px solid var(--line-2)}
.list-head select{border:0;background:transparent;color:var(--text-2);font-size:12px;cursor:pointer}
.results{overflow:auto;flex:1;padding:6px 8px 20px}
.res{display:flex;gap:11px;align-items:center;padding:9px 10px;border-radius:11px;cursor:pointer;position:relative}
.res:hover{background:var(--surface-2)}
.res.kb{background:var(--surface-2);outline:1.5px solid var(--line)}
.res.sel{background:var(--accent-soft)}
.res.sel::before{content:"";position:absolute;right:-8px;top:10px;bottom:10px;width:3px;border-radius:3px;background:var(--accent)}
.av{width:38px;height:38px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:600;font-size:14px;color:#fff}
.res .meta{flex:1;min-width:0}
.res .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res .sub{font-size:12px;color:var(--text-3);display:flex;gap:8px;white-space:nowrap}
mark{background:var(--hl);color:inherit;border-radius:3px;padding:0 1px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;white-space:nowrap}
.pill.owe{background:var(--owe-soft);color:var(--owe)}
.pill.credit{background:var(--credit-soft);color:var(--credit)}
.pill.zero{background:var(--surface-2);color:var(--text-3)}
.dot-alert{width:7px;height:7px;border-radius:50%;background:var(--alert);display:inline-block;margin-inline-start:4px;vertical-align:middle}
.empty{padding:40px 20px;text-align:center;color:var(--text-3)}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;justify-content:space-between;padding:14px 18px 0}
.card-h h3{margin:0;font-size:14.5px;font-weight:600}
.card-b{padding:14px 18px 18px}
.grid{display:grid;gap:16px}
.kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.kpi{padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.kpi .l{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px;letter-spacing:-.02em}
.kpi .s{font-size:11.5px;color:var(--text-3);margin-top:2px}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.kpi.hero .l,.kpi.hero .s{color:inherit;opacity:.85}
.kpi.owe .v{color:var(--owe)} .kpi.credit .v{color:var(--credit)}
.cur{font-size:.55em;font-weight:500;opacity:.7;margin-inline-start:3px}

/* dashboard */
.hello{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.hello h2{margin:0;font-size:22px;letter-spacing:-.02em}
.hello p{margin:2px 0 0;color:var(--text-2)}
.bars{display:flex;align-items:flex-end;gap:4px;height:190px;padding-top:10px;direction:ltr}
.bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;position:relative;cursor:default}
.bar i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 2px 2px;opacity:.85;transition:opacity .15s;min-height:2px}
.bar:hover i{opacity:1;background:var(--accent-2)}
.bar span{font-size:10px;color:var(--text-3);position:absolute;bottom:-19px;white-space:nowrap}
.bars{margin-bottom:22px}
.tip{position:fixed;z-index:50;pointer-events:none;background:var(--text);color:var(--bg);padding:7px 10px;border-radius:9px;font-size:12px;box-shadow:var(--shadow-lg);max-width:300px;opacity:0;transition:opacity .1s}
.tip.on{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(120px,1.2fr) 2fr auto;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.hbar .track{height:9px;background:var(--line-2);border-radius:9px;overflow:hidden}
.hbar .track i{display:block;height:100%;background:var(--accent);border-radius:9px}
.hbar small{display:block;font-size:11px;color:var(--text-3);line-height:1.2}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.rowlink{display:flex;align-items:center;gap:10px;padding:8px 6px;border-radius:10px;cursor:pointer}
.rowlink:hover{background:var(--surface-2)}
.rowlink .av{width:30px;height:30px;font-size:12px}
.rowlink .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:500}
.stack{display:flex;height:12px;border-radius:12px;overflow:hidden;margin:6px 0 12px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-inline-end:6px}

/* patient */
.ph{display:flex;gap:18px;align-items:flex-start;padding:20px 22px}
.ph .av{width:64px;height:64px;font-size:24px}
.ph h2{margin:0;font-size:24px;letter-spacing:-.02em;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:2px 9px;color:var(--text-2)}
.ph-actions{display:flex;gap:8px;margin-inline-start:auto;flex-wrap:wrap;justify-content:flex-end}
.btn{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 13px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:13px;text-decoration:none;color:var(--text)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.07);color:var(--accent-ink)}
.alerts{display:flex;gap:8px;flex-wrap:wrap;padding:0 22px 16px}
.alert{background:var(--alert-soft);color:var(--alert);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600;display:flex;gap:6px;align-items:center}
.alert span{font-weight:400}
.note{margin:0 22px 16px;padding:10px 14px;border-radius:10px;background:var(--surface-2);border:1px dashed var(--line);font-size:13px}
.facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-2)}
.facts div{padding:11px 22px;border-inline-start:1px solid var(--line-2)}
.facts div:first-child{border-inline-start:0}
.facts b{display:block;font-size:11.5px;font-weight:500;color:var(--text-3)}
.paybar{height:8px;border-radius:8px;background:var(--line-2);overflow:hidden;display:flex;margin-top:12px}
.paybar i{display:block;height:100%}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);padding:0 10px;overflow-x:auto}
.tab{border:0;background:transparent;padding:12px 12px 11px;cursor:pointer;color:var(--text-2);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab b{font-size:11px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:0 7px;font-weight:600;color:var(--text-3)}
.tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.tab.on b{color:var(--accent);border-color:var(--accent-soft);background:var(--accent-soft)}

table{width:100%;border-collapse:collapse}
th{font-size:11.5px;font-weight:600;color:var(--text-3);text-align:start;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2);position:sticky;top:0}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;white-space:nowrap}
.tbl-wrap{overflow:auto}
.pname{font-weight:600}
.pname small{display:block;font-weight:400;color:var(--text-3);font-size:12px}
.st{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:999px;padding:1px 9px;white-space:nowrap}
.st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st.done{color:var(--done);background:var(--done-soft)}
.st.prog{color:var(--prog);background:var(--prog-soft)}
.st.plan{color:var(--plan);background:var(--plan-soft)}
.tooth{display:inline-block;font-size:12px;font-weight:600;border:1px solid var(--line);border-radius:7px;padding:0 7px;background:var(--surface-2);white-space:nowrap}
.minipays{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.mp{font-size:11.5px;border-radius:7px;padding:1px 8px;background:var(--surface-2);border:1px solid var(--line-2);color:var(--text-2)}
.mp.disc{color:var(--prog)} .mp.fromdep{color:var(--plan)}
.visit-h td{background:var(--surface-2);font-size:12.5px;font-weight:600;color:var(--text-2);padding:7px 12px}
.visit-h td .faint{font-weight:400}
.ev{display:inline-flex;align-items:center;gap:6px;font-weight:600}
.ev i{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:12px}
.ev.charge i{background:var(--surface-2);color:var(--text-2);border:1px solid var(--line)}
.ev.pay i{background:var(--credit-soft);color:var(--credit)}
.ev.dep i{background:var(--accent-soft);color:var(--accent)}
.ev.disc i{background:var(--prog-soft);color:var(--prog)}
.ev.fromdep i{background:var(--plan-soft);color:var(--plan)}
.amt-plus{color:var(--text)} .amt-minus{color:var(--credit)}
.runbal{font-weight:600}
tfoot td{font-weight:700;background:var(--surface-2);border-top:1px solid var(--line)}
.filterbar{display:flex;gap:8px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line-2);font-size:12.5px;color:var(--text-2)}

/* tooth chart */
.chart-wrap{display:grid;grid-template-columns:1fr 230px;gap:10px;align-items:center}
.teeth{direction:ltr;width:100%;max-width:640px;margin:0 auto;display:block}
.teeth .t rect{fill:var(--surface-2);stroke:var(--line);stroke-width:1.2;transition:transform .1s}
.teeth .t text{fill:var(--text-3);font-size:9.5px;font-family:var(--font);text-anchor:middle}
.teeth .t.has{cursor:pointer}
.teeth .t.done rect{fill:var(--done-soft);stroke:var(--done);stroke-width:1.6}
.teeth .t.prog rect{fill:var(--prog-soft);stroke:var(--prog);stroke-width:1.6}
.teeth .t.plan rect{fill:var(--plan-soft);stroke:var(--plan);stroke-width:1.6}
.teeth .t.pend rect{stroke-dasharray:3 2}
.teeth .t.has text{fill:var(--text);font-weight:700}
.teeth .t.focus rect{stroke:var(--text);stroke-width:2.2}
.teeth .t .cnt{fill:var(--text-2);font-size:8px}
.teeth .mid{stroke:var(--line);stroke-dasharray:2 3}
.teeth .lbl{fill:var(--text-3);font-size:9px;font-family:var(--font)}
.chart-side{font-size:12.5px}
.chart-side .legend{flex-direction:column;gap:6px}
.areas{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}

.back{display:none}
[hidden]{display:none!important}
body.locked .top,body.locked .app{display:none}
#lock{position:fixed;inset:0;display:grid;place-items:center;padding:16px;background:var(--bg)}
.lock-card{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:30px 26px;text-align:center}
.lock-card h2{margin:0;font-size:20px}
.lock-card p{margin:4px 0 18px;color:var(--text-2);font-size:13px}
.lock-card input[type=password]{width:100%;height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);padding:0 14px;font-size:15px;outline:none;text-align:center}
.lock-card input[type=password]:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.lock-card .remember{display:flex;gap:8px;align-items:center;justify-content:center;font-size:12.5px;color:var(--text-2);margin:12px 0 14px;cursor:pointer}
.lock-card .btn{width:100%;justify-content:center;height:44px;font-size:15px}
.lock-err{color:var(--alert);font-size:13px;min-height:20px;margin-top:10px}
.shake{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)} .split{grid-template-columns:1fr} .chart-wrap{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr;height:auto}
  .side{border-left:0;border-bottom:1px solid var(--line)}
  .results{max-height:55vh}
  body.viewing .side{display:none}
  body.viewing .back{display:inline-flex}
  .main-inner{padding:16px 16px 50px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .facts div:nth-child(3){border-inline-start:0}
  .ph{flex-wrap:wrap;padding:16px}
  .ph-actions{margin-inline-start:0;justify-content:flex-start;width:100%}
  .top{padding:10px 16px}
  .brand small,#dashBtn span{display:none}
  .brand h1{white-space:nowrap;font-size:15px}
  .top{gap:8px}
}
@media print{
  .top,.side,.tabs,.ph-actions,.no-print,.filterbar{display:none!important}
  .app{display:block;height:auto} .main{overflow:visible}
  body{background:#fff;color:#000}
  .card,.kpi{box-shadow:none;break-inside:avoid}
  .print-all [data-pane]{display:block!important;margin-bottom:14px}
  .main-inner{max-width:none;padding:0}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand" id="home" title="الرئيسية">
    <div class="brand-mark"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5.5c-1.5-1.3-3.2-2-5-1.7C4.6 4.2 3.3 6.4 3.6 9c.3 2.3 1.2 3.9 1.7 6.3.4 2 .6 4.9 2.2 5.2 1.7.3 2-2.6 2.6-4.4.4-1.2 1-1.8 1.9-1.8s1.5.6 1.9 1.8c.6 1.8.9 4.7 2.6 4.4 1.6-.3 1.8-3.2 2.2-5.2.5-2.4 1.4-4 1.7-6.3.3-2.6-1-4.8-3.4-5.2-1.8-.3-3.5.4-5 1.7z"/></svg></div>
    <div><h1>سجلات المرضى</h1><small id="sub"></small></div>
  </div>

function dateAr(iso){ if(!iso) return "—"; const [y,m,d]=iso.slice(0,10).split("-"); return `${+d} ${MONTHS[m-1]} ${y}`; }
function timeAr(iso){ if(!iso||iso.length<16) return ""; let [h,mi]=iso.slice(11,16).split(":").map(Number); const pm=h>=12; h=h%12||12; return `${h}:${String(mi).padStart(2,"0")} ${pm?"م":"ص"}`; }

  if(d < 1) return "النهارده"; if(d < 2) return "امبارح";

}

const AV = ["#0f766e","#7c3aed","#c2410c","#2563eb","#be185d","#4d7c0f","#b45309","#0e7490","#9333ea","#dc2626"];

/* ---------- Arabic-aware normalization for search ---------- */
const AR_DIG = {"٠":"0","١":"1","٢":"2","٣":"3","٤":"4","٥":"5","٦":"6","٧":"7","٨":"8","٩":"9","۰":"0","۱":"1","۲":"2","۳":"3","۴":"4","۵":"5","۶":"6","۷":"7","۸":"8","۹":"9"};
const AR_MAP = {"أ":"ا","إ":"ا","آ":"ا","ٱ":"ا","ة":"ه","ى":"ي","ئ":"ي","ؤ":"و"};
const DROP = /[ً-ْٰـ]/;
function normChars(s){ // returns [normalized string, index map to original]
  let out="", map=[];
  for(let i=0;i<s.length;i++){
    let c=s[i]; if(DROP.test(c)) continue;
    c = AR_DIG[c] || AR_MAP[c] || c.toLowerCase();
    out+=c; map.push(i);
  }
  return [out, map];
}
const norm = s => normChars(s)[0];
P.forEach(p=>{
  p._n = norm(p.name);
  p._ns = p._n.replace(/\s+/g,"");
  p._ph = [p.phone, p.phoneRaw.replace(/\D/g,""), ...p.alt].filter(Boolean);
  p._no = String(+p.no);
  p._words = p._n.split(" ");
});

function parseQuery(q){
  const n = norm(q).trim();
  if(!n) return null;
  const whole = n.replace(/[\s\-+()]/g,"");
  const toks = /^\d+$/.test(whole) ? [whole] : n.split(/\s+/).filter(Boolean);
  return toks.map(t=>{
    const digits = t.replace(/[\s\-+()]/g,"");
    if(/^\d+$/.test(digits)){
      let d = digits;
      if(d.startsWith("0020")) d = "0"+d.slice(4); else if(d.startsWith("20") && d.length>=12) d = "0"+d.slice(2);
      return {num:true, d, core:d.replace(/^0+/,"")};
    }
    return {num:false, t};
  });
}
function score(p, toks){
  let s = 0;
  for(const k of toks){
    if(k.num){
      let best = 0;
      if(k.core && p._no === k.core) best = 120;
      for(const ph of p._ph){
        if(ph === k.d) best = Math.max(best, 110);
        else if(k.core.length>=3 && ph.replace(/^0+/,"").startsWith(k.core)) best = Math.max(best, 70);
        else if(k.core.length>=3 && ph.includes(k.core)) best = Math.max(best, 50);
      }
      if(!best && k.core && p.no.includes(k.d)) best = 30;
      if(!best) return 0;
      s += best;
    } else {
      const t = k.t;
      let best = 0;
      if(p._words[0].startsWith(t)) best = 40;
      else if(p._words.some(w=>w.startsWith(t))) best = 30;
      else if(p._n.includes(t)) best = 18;
      else if(t.length>2 && p._ns.includes(t)) best = 12;
      if(!best) return 0;
      s += best;
    }
  }
  return s;
}
function highlight(name, toks){
  const textToks = (toks||[]).filter(k=>!k.num).map(k=>k.t);
  if(!textToks.length) return esc(name);
  const [n, map] = normChars(name);
  const hit = new Array(name.length).fill(false);
  for(const t of textToks){
    let i = n.indexOf(t);
    while(i>-1){ for(let j=i;j<i+t.length;j++) hit[map[j]] = true; i = n.indexOf(t, i+t.length); }
  }
  let out="", open=false;
  for(let i=0;i<name.length;i++){
    if(hit[i] && !open){ out+="<mark>"; open=true; }
    if(!hit[i] && open){ out+="</mark>"; open=false; }
    out+=esc(name[i]);
  }
  return out + (open?"</mark>":"");
}
function phoneHi(ph, toks){
  const shown = fmtPhone(ph);
  const nums = (toks||[]).filter(k=>k.num && k.core.length>=3);
  if(!nums.length) return esc(shown);
  const raw = ph; let pos=-1, len=0;
  for(const k of nums){ const i = raw.indexOf(k.d.length>=3?k.d:k.core); if(i>-1){pos=i;len=(k.d.length>=3?k.d:k.core).length;break;} const j=raw.indexOf(k.core); if(j>-1){pos=j;len=k.core.length;break;} }
  if(pos<0) return esc(shown);
  // map raw index -> shown index (shown inserts spaces after 3 and 7)
  const toShown = i => i + (i>=3?1:0) + (i>=7?1:0);
  const a = toShown(pos), b = toShown(pos+len-1)+1;
  return esc(shown.slice(0,a)) + "<mark>" + esc(shown.slice(a,b)) + "</mark>" + esc(shown.slice(b));
}

/* ---------- patient ---------- */
let pState = {tab:"statement", tooth:null};
const UPPER = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const LOWER = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];
const UPPER_P = [55,54,53,52,51,61,62,63,64,65];
const LOWER_P = [85,84,83,82,81,71,72,73,74,75];
const isSingle = t => /^\d{2}$/.test(t||"");

function toothMap(p){
  const m = {};
  const add = (t, x, pending) => { (m[t] ||= []).push({...x, pending}); };
  p.procs.forEach(x=>isSingle(x.tooth) && add(x.tooth, x, false));
  p.plan.forEach(x=>isSingle(x.tooth) && add(x.tooth, x, true));
  return m;
}
function toothChart(p){
  const m = toothMap(p);
  const primary = Object.keys(m).some(t=>+t>=51);
  const W=30, G=4, H=38;
  const rowSvg = (teeth, y, isUpper, offset=0) => teeth.map((t,i)=>{
    const x = offset + i*(W+G) + (i>=teeth.length/2 ? 10 : 0);
    const items = m[t]||[];
    let cls = "t";
    if(items.length){
      cls += " has " + (items.some(z=>z.st==="done")?"done":items.some(z=>z.st==="prog")?"prog":"plan");
      if(items.every(z=>z.pending)) cls+=" pend";
    }
    if(pState.tooth===String(t)) cls+=" focus";
    const tipHtml = items.length ? `<b>سن ${t}</b><br>`+items.map(z=>`${esc(z.name)} · ${ST[z.st]}${z.pending?" (خطة)":""} · ${dateAr(z.d)}`).join("<br>") : "";
    const ty = isUpper ? y+H+12 : y-5;
    return `<g class="${cls}" data-tooth="${t}" ${items.length?`data-tip="${esc(tipHtml)}"`:""}>
      <rect x="${x}" y="${y}" width="${W}" height="${H}" rx="${isUpper?"8 8 12 12":"12"}" ry="10"/>
      <text x="${x+W/2}" y="${ty}">${t}</text>
      ${items.length>1?`<text class="cnt" x="${x+W/2}" y="${y+H/2+3}">×${items.length}</text>`:""}
    </g>`;
  }).join("");
  const full = 16*(W+G)+10;
  const pOff = (full - (10*(W+G)+10))/2;
  let h = 0, body = "";
  if(primary){
    body += `<text class="lbl" x="0" y="10">لبني</text>` + rowSvg(UPPER_P, 4, true, pOff); h = 70;
  }
  body += rowSvg(UPPER, h+4, true) + `<line class="mid" x1="${full/2}" x2="${full/2}" y1="${h}" y2="${h+H*2+50}"/>` + rowSvg(LOWER, h+H+40, false);
  h += H*2+48;
  if(primary){ body += rowSvg(LOWER_P, h+20, false, pOff); h += 66; }
  const areas = [...p.procs, ...p.plan].filter(x=>x.tooth && !isSingle(x.tooth) || (!x.tooth && x.area && !/^[A-Z]+$/.test(x.area)));
  const areaName = x => x.tooth==="18-28" ? "الفك العلوي" : x.tooth==="38-48" ? "الفك السفلي" : x.tooth==="55-65" ? "الفك العلوي (لبني)" : (x.area || x.tooth || "الفم كله");
  return `<div class="chart-wrap">
    <svg class="teeth" viewBox="-6 -4 ${full+12} ${h+8}">${body}</svg>
    <div class="chart-side">
      <div class="legend">
        <span><i style="background:var(--done)"></i>تم</span>
        <span><i style="background:var(--prog)"></i>جاري</span>
        <span><i style="background:var(--plan)"></i>مخطط / لسه</span>
      </div>
      <p class="faint" style="margin:10px 0 0;font-size:12px">ترقيم FDI · دوس على السن عشان تشوف شغله بس</p>
      ${areas.length?`<div class="areas">${areas.map(x=>`<span class="tag"><span class="st ${x.st}" style="padding:0;background:none"></span> ${esc(x.name)} · ${esc(areaName(x))}</span>`).join("")}</div>`:""}
    </div>
  </div>`;
}

function statementRows(p){
  const ev = [];
  p.procs.forEach(x=>ev.push({d:x.d, kind:"charge", amt:x.fee, title:x.name, ar:x.ar, tooth:x.tooth, st:x.st, ord:0}));
  p.events.forEach(e=>ev.push({d:e.d, kind:e.t, amt:e.amt, title:e.proc, tooth:e.tooth, m:e.m, ord: e.t==="dep"?1:e.t==="fromdep"?3:2}));
  ev.sort((a,b)=>(a.d||"").localeCompare(b.d||"") || a.ord-b.ord);
  let run = 0;
  ev.forEach(e=>{ if(e.kind==="charge") run+=e.amt; else if(e.kind!=="fromdep") run-=e.amt; e.run=run; });
  return ev;
}

    <div class="kpi"><div class="l">ديبوزيت</div><div class="v">${money(t.dep)}</div><div class="s">${t.dep?`اتخصم منه ${fmt(t.depUsed)}`:"مفيش"}</div></div>
    <div class="kpi ${t.bal>0.5?"owe":t.bal<-0.5?"credit":""}"><div class="l">${t.bal>0.5?"المتبقي عليه":t.bal<-0.5?"رصيد ليه":"الحساب"}</div><div class="v">${Math.abs(t.bal)>0.5?money(Math.abs(t.bal)):"خالص ✓"}</div>
      <div class="paybar" title="مدفوع ${paidPct.toFixed(0)}%"><i style="width:${paidPct}%;background:var(--credit)"></i><i style="width:${discPct}%;background:var(--prog)"></i></div></div>
  </div>

  ${(p.procs.length||p.plan.length)?`<div class="card" style="margin-top:14px">
    <div class="card-h"><h3>خريطة الأسنان</h3>${pState.tooth?`<button class="btn" style="height:28px;font-size:12px" id="clrTooth">سن ${pState.tooth} ✕ إلغاء الفلتر</button>`:""}</div>
    <div class="card-b">${toothChart(p)}</div>
  </div>`:""}

  <div class="card print-all" style="margin-top:14px">
    <div class="tabs">${tabs.map(x=>`<button class="tab ${pState.tab===x.k?"on":""}" data-tab="${x.k}">${x.l} <b>${x.n}</b></button>`).join("")}</div>
    ${pState.tooth?`<div class="filterbar">بتعرض شغل <span class="tooth">سن ${pState.tooth}</span> بس <button class="btn" style="height:26px;font-size:12px" id="clrTooth2">عرض الكل</button></div>`:""}
    <div data-pane="statement" ${pState.tab!=="statement"?'style="display:none"':""}>${paneStatement(p)}</div>
    <div data-pane="procs" ${pState.tab!=="procs"?'style="display:none"':""}>${paneProcs(p)}</div>
    <div data-pane="pays" ${pState.tab!=="pays"?'style="display:none"':""}>${panePays(p)}</div>
    ${p.plan.length?`<div data-pane="plan" ${pState.tab!=="plan"?'style="display:none"':""}>${panePlan(p)}</div>`:""}
    ${p.labs.length?`<div data-pane="labs" ${pState.tab!=="labs"?'style="display:none"':""}>${paneLabs(p)}</div>`:""}
  </div>
  <p class="faint no-print" style="font-size:11.5px;margin-top:14px">كل التواريخ بتوقيت القاهرة · المتبقي = إجمالي الحساب − الخصومات − المدفوع − الديبوزيت</p>`;

  bindTips($("#view"));
  $("#view").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ pState.tab=b.dataset.tab; renderPatient(p); });
  $("#view").querySelectorAll(".t.has").forEach(g=>g.onclick=()=>{ hideTip(); pState.tooth = pState.tooth===g.dataset.tooth?null:g.dataset.tooth; if(pState.tab==="statement"||pState.tab==="pays") pState.tab = pState.tab; renderPatient(p); });
  ["#clrTooth","#clrTooth2"].forEach(s=>{ const b=$(s); if(b) b.onclick=()=>{ pState.tooth=null; renderPatient(p); }; });
  const cp = $("#copyPh"); if(cp) cp.onclick = ()=>{ navigator.clipboard?.writeText(p.phone).then(()=>{ cp.textContent="✓ اتنسخ"; setTimeout(()=>cp.textContent="نسخ الرقم",1400); }); };
  $("#printBtn").onclick = ()=>window.print();
}
const toothOk = x => !pState.tooth || x.tooth===pState.tooth;

function paneStatement(p){
  const rows = statementRows(p).filter(toothOk);
  if(!rows.length) return `<div class="empty">مفيش حركات</div>`;
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>التاريخ</th><th>الحركة</th><th>التفاصيل</th><th class="n">عليه (+)</th><th class="n">دفع / خصم (−)</th>${pState.tooth?"":`<th class="n">الرصيد</th>`}</tr></thead>
    <tbody>${rows.map(e=>{
      const k = KIND[e.kind];
      const plus = e.kind==="charge";
      return `<tr>
        <td style="white-space:nowrap">${dateAr(e.d)}<div class="faint" style="font-size:11.5px">${timeAr(e.d)}</div></td>
        <td><span class="ev ${e.kind}"><i>${k.ic}</i>${k.l}</span></td>
        <td>${plus?`<span class="pname">${esc(e.title)}${e.ar?` <small>${esc(e.ar)}</small>`:""}</span>`:`${e.title?`<span class="muted">عن: ${esc(e.title)}</span>`:`<span class="muted">دفعة مقدمة</span>`}`}
            ${e.tooth?` <span class="tooth">${esc(e.tooth)}</span>`:""}${e.m&&e.kind!=="disc"?` <span class="faint" style="font-size:12px">· ${esc(e.m)}</span>`:""}</td>
        <td class="n">${plus?money(e.amt):""}</td>
        <td class="n">${!plus&&e.kind!=="fromdep"?money(e.amt,"amt-minus"):e.kind==="fromdep"?`<span class="faint" title="اتخصم من الديبوزيت اللي اتدفع قبل كده">(${fmt(e.amt)})</span>`:""}</td>
        ${pState.tooth?"":`<td class="n runbal" style="color:${e.run>0.5?"var(--owe)":e.run<-0.5?"var(--credit)":"var(--text-3)"}">${fmt(e.run)}</td>`}
      </tr>`;}).join("")}</tbody>
    ${pState.tooth?"":`<tfoot><tr><td colspan="3">الإجمالي</td><td class="n">${money(p.tot.charges)}</td><td class="n">${money(p.tot.cash+p.tot.dep+p.tot.disc,"amt-minus")}</td><td class="n" style="color:${p.tot.bal>0.5?"var(--owe)":p.tot.bal<-0.5?"var(--credit)":"inherit"}">${fmt(p.tot.bal)}</td></tr></tfoot>`}
  </table></div>`;
}
function paneProcs(p){
  const list = p.procs.filter(toothOk);
  if(!list.length) return `<div class="empty">مفيش إجراءات</div>`;
  const groups = {};
  list.forEach(x=>{ (groups[(x.d||"").slice(0,10)] ||= []).push(x); });
  const keys = Object.keys(groups).sort().reverse();
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>الإجراء</th><th>السن</th><th>الحالة</th><th class="n">السعر</th><th class="n">خصم</th><th class="n">مدفوع</th><th class="n">متبقي</th></tr></thead>
    <tbody>${keys.map(k=>`<tr class="visit-h"><td colspan="7">${dateAr(k)} <span class="faint">· ${nProc(groups[k].length)} · ${ago(k)}</span></td></tr>`+groups[k].map(x=>`<tr>
      <td><div class="pname">${esc(x.name)} ${x.code?`<span class="faint" style="font-weight:400;font-size:11.5px">${esc(x.code)}</span>`:""}<small>${esc(x.ar)}</small></div>
        ${x.pays.length?`<div class="minipays">${x.pays.map(e=>`<span class="mp ${e.t}">${e.t==="disc"?"خصم":e.t==="fromdep"?"من الديبوزيت":esc(e.m)} <b class="num">${fmt(e.amt)}</b> · ${dateAr(e.d)}</span>`).join("")}</div>`:""}</td>
      <td>${x.tooth?`<span class="tooth">${esc(x.tooth)}</span>`:""}${x.area&&/^[A-Z]+$/.test(x.area)?` <span class="faint" style="font-size:11.5px" title="السطح">${esc(x.area)}</span>`:x.area?`<span class="faint" style="font-size:12px">${esc(x.area)}</span>`:""}</td>
      <td><span class="st ${x.st}">${ST[x.st]}</span></td>
      <td class="n">${money(x.fee)}</td>
      <td class="n">${x.disc?money(x.disc):'<span class="faint">—</span>'}</td>
      <td class="n">${money(x.paid)}</td>
      <td class="n" style="color:${x.bal>0.5?"var(--owe)":"var(--text-3)"};font-weight:${x.bal>0.5?600:400}">${x.bal>0.5?fmt(x.bal):"✓"}</td>
    </tr>`).join("")).join("")}</tbody>
  </table></div>`;
}
function panePays(p){
  const list = p.events.filter(toothOk).slice().reverse();
  if(!list.length) return `<div class="empty">مفيش مدفوعات متسجلة</div>`;
  const label = {pay:"دفع", dep:"ديبوزيت", disc:"خصم", fromdep:"من الديبوزيت"};
  return `<div class="tbl-wrap"><table>
    <thead><tr><th>التاريخ</th><th>النوع</th><th>الطريقة</th><th>عن إجراء</th><th class="n">المبلغ</th></tr></thead>
    <tbody>${list.map(e=>`<tr>
      <td style="white-space:nowrap">${dateAr(e.d)} <span class="faint" style="font-size:11.5px">${timeAr(e.d)}</span></td>
      <td><span class="ev ${e.t}"><i>${KIND[e.t].ic}</i>${label[e.t]}</span></td>
      <td class="muted">${e.t==="disc"?"—":esc(e.m)}</td>
      <td>${e.proc?esc(e.proc):'<span class="faint">دفعة مقدمة</span>'} ${e.tooth?`<span class="tooth">${esc(e.tooth)}</span>`:""}</td>
      <td class="n">${money(e.amt, e.t==="pay"||e.t==="dep"?"amt-minus":"")}</td>
    </tr>`).join("")}</tbody>
  </table></div>`;
}
function panePlan(p){
  const list = p.plan.filter(toothOk);
  return `<div class="filterbar" style="border:0;padding-bottom:0">إجراءات متسجلة في خطة العلاج بس لسه ما اتضافتش على الحساب — مش داخلة في المتبقي.</div>
  <div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>الإجراء</th><th>السن</th><th>الحالة</th><th class="n">السعر المقترح</th></tr></thead>
  <tbody>${list.map(x=>`<tr><td>${dateAr(x.d)}</td><td><div class="pname">${esc(x.name)}<small>${esc(x.ar)}</small></div></td><td>${x.tooth?`<span class="tooth">${esc(x.tooth)}</span>`:""}</td><td><span class="st ${x.st}">${ST[x.st]}</span></td><td class="n">${money(x.fee)}</td></tr>`).join("")}</tbody>
  <tfoot><tr><td colspan="4">إجمالي الخطة</td><td class="n">${money(list.reduce((a,x)=>a+x.fee,0))}</td></tr></tfoot></table></div>`;
}
function paneLabs(p){
  const stAr = {New:"جديد",Ordered:"اتطلب",Delivered:"اتسلم"};
  return `<div class="tbl-wrap"><table><thead><tr><th>التاريخ</th><th>المنتج</th><th>السن</th><th>المعمل</th><th>الحالة</th></tr></thead>
  <tbody>${p.labs.filter(toothOk).map(x=>`<tr><td>${dateAr(x.d)}</td><td>${esc(x.prod)}</td><td>${x.tooth?`<span class="tooth">${esc(x.tooth)}</span>`:""}</td><td>${esc(x.lab)||'<span class="faint">—</span>'}</td><td>${esc(stAr[x.st]||x.st)}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- boot ---------- */
$("#sub").textContent = `${S.patients} مريض · مستخرجة من Dentalore · ${DATA.generated.slice(0,10)}`;
renderChips(); renderList(); route();
if(!location.hash) qEl.focus();
if(ENC){
  const lb = $("#lockBtn"); lb.hidden = false;
  lb.onclick = ()=>{ try{ localStorage.removeItem("clinicKey"); }catch(e){} location.reload(); };
}
}

/* ---------- password lock (AES-256-GCM, key from PBKDF2-SHA256) ---------- */
const b64 = s => Uint8Array.from(atob(s), c=>c.charCodeAt(0));
async function openWith(key){
  const buf = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
  const txt = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  return JSON.parse(txt);
}
async function keyFromPassword(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:ENC.it, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, true, ["decrypt"]);
}
function unlocked(data){
  document.body.classList.remove("locked");
  document.getElementById("lock").hidden = true;
  boot(data);
}
(async ()=>{
  if(PLAIN){ boot(PLAIN); return; }
  const lock = document.getElementById("lock"), form = document.getElementById("lockForm");
  const pw = document.getElementById("pw"), err = document.getElementById("lockErr"), btn = form.querySelector("button");
  try{
    const saved = localStorage.getItem("clinicKey");
    if(saved){
      const key = await crypto.subtle.importKey("raw", b64(saved), "AES-GCM", false, ["decrypt"]);
      return unlocked(await openWith(key));
    }
  }catch(e){ try{ localStorage.removeItem("clinicKey"); }catch(_){} }
  document.body.classList.add("locked");
  lock.hidden = false; pw.focus();
  form.addEventListener("submit", async e=>{
    e.preventDefault();
    err.textContent = ""; btn.disabled = true; btn.textContent = "بيفتح…";
    try{
      const key = await keyFromPassword(pw.value);
      const data = await openWith(key);
      if(document.getElementById("remember").checked){
        const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key));
        try{ localStorage.setItem("clinicKey", btoa(String.fromCharCode(...raw))); }catch(_){}
      }
      unlocked(data);
    }catch(e2){
      err.textContent = "الباسورد غلط"; pw.select();
      form.classList.remove("shake"); void form.offsetWidth; form.classList.add("shake");
    }finally{ btn.disabled = false; btn.textContent = "فتح"; }
  });
})();
</script>
